spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meetinguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meetingpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT secret read from env JWT_SECRET or default
jwt.secret=${JWT_SECRET:change-this-secret}
