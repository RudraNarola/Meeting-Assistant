spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: http://localhost:6969/oauth2/callback/google

encryption:
  secret: ${ENCRYPTION_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
