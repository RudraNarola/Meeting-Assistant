spring:
  application:
    name: meeting-assitant
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/calendar_db}
    username: ${DB_USER:calendaruser}
    password: ${DB_PASSWORD:calendarpass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 6969

google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
  redirect-uri: http://localhost:6969/oauth2/callback/google

encryption:
  secret: ${ENCRYPTION_SECRET:supersupersecret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
