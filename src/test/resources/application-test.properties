# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.flyway.enabled=false
logging.level.org.springframework.web=DEBUG

# Google OAuth test configuration
google.client-id=test-client-id
google.client-secret=test-client-secret
google.redirect-uri=http://localhost:6969/oauth2/callback/google

# Encryption test configuration
encryption.secret=test-encryption-secret