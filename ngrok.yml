# ngrok configuration for Meeting Assistant
# Run: ngrok start --all --config ngrok.yml

version: "2"
authtoken: YOUR_AUTH_TOKEN_HERE

tunnels:
  frontend:
    addr: 3000
    proto: http
    # Enable inspection for debugging
    inspect: true
    # Custom subdomain (requires paid plan)
    # subdomain: meeting-assistant

  backend:
    addr: 8080
    proto: http
    inspect: true
    # Custom subdomain (requires paid plan)
    # subdomain: meeting-api
