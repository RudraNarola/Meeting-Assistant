version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: calendar-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: calendar_db
      MYSQL_USER: calendaruser
      MYSQL_PASSWORD: calendarpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
