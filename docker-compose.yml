version: "3.8"

services:
  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: transcript-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - transcript-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: transcript-postgres
    environment:
      POSTGRES_USER: transcript_user
      POSTGRES_PASSWORD: transcript_pass
      POSTGRES_DB: transcript_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcript-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcript_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: transcript-redis
    ports:
      - "6379:6379"
    networks:
      - transcript-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: transcript-api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUDIO_SERVICE_URL=http://audio-service:8081
      - TRANSCRIPTION_SERVICE_URL=http://transcription-service:8082
      - DIARIZATION_SERVICE_URL=http://diarization-service:8083
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transcript-network
    restart: unless-stopped

  # Audio Processing Service
  audio-service:
    build:
      context: .
      dockerfile: services/audio-service/Dockerfile
    container_name: transcript-audio-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=transcript_user
      - DB_PASSWORD=transcript_pass
      - DB_NAME=transcript_db
      - STORAGE_PATH=/app/storage
    volumes:
      - audio-storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - transcript-network
    restart: unless-stopped

  # Transcription Service
  transcription-service:
    build:
      context: .
      dockerfile: services/transcription-service/Dockerfile
    container_name: transcript-transcription-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=transcript_user
      - DB_PASSWORD=transcript_pass
      - DB_NAME=transcript_db
      - STORAGE_PATH=/app/storage
      - WHISPER_SERVICE_URL=http://whisper-service:8084
    volumes:
      - audio-storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      whisper-service:
        condition: service_started
    networks:
      - transcript-network
    restart: unless-stopped

  # Whisper AI Transcription Service
  whisper-service:
    build:
      context: ./services/whisper-service
      dockerfile: Dockerfile
    container_name: transcript-whisper-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - WHISPER_MODEL=tiny
    networks:
      - transcript-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Speaker Diarization Service
  diarization-service:
    build:
      context: .
      dockerfile: services/diarization-service/Dockerfile
    container_name: transcript-diarization-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=transcript_user
      - DB_PASSWORD=transcript_pass
      - DB_NAME=transcript_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - transcript-network
    restart: unless-stopped

networks:
  transcript-network:
    driver: bridge

volumes:
  postgres-data:
  audio-storage:
