version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: meetingdb
      POSTGRES_USER: meetinguser
      POSTGRES_PASSWORD: meetingpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/meetingdb
      SPRING_DATASOURCE_USERNAME: meetinguser
      SPRING_DATASOURCE_PASSWORD: meetingpass
      JWT_SECRET: change-this-secret
    ports:
      - "8081:8080"

volumes:
  pgdata:
